# Rate-limit login POSTs at the edge (Flask-Limiter is the app-layer backup).
limit_req_zone $binary_remote_addr zone=ms_login:10m rate=1r/s;
limit_req_status 429;

upstream multistream_ui {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name multistream-jixozpwkde4wu.centralindia.cloudapp.azure.com 20.219.6.126 _;

    # Certbot will add ACME + HTTPS server blocks; keep /.well-known reachable on :80.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location = /login {
        limit_req zone=ms_login burst=5 nodelay;
        proxy_pass http://multistream_ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://multistream_ui;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /healthz {
        proxy_pass http://multistream_ui/healthz;
    }
}
