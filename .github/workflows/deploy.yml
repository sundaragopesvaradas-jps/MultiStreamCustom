name: Deploy to Azure VM

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, multistream]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install to app directory
        env:
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.cursor' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude 'actions-runner' \
            ./ /home/multistream/MultiStreamCustom/
          export DEPLOY_REVISION="${DEPLOY_REVISION:0:7}"
          sudo --preserve-env=DEPLOY_REVISION \
            /usr/bin/bash /home/multistream/MultiStreamCustom/vm/update.sh

      - name: Verify health
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            BODY="$(curl -fsS http://127.0.0.1:8080/healthz || true)"
            if echo "$BODY" | grep -q '"ok"'; then
              echo "$BODY"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed" >&2
          exit 1
