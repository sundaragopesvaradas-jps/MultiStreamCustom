name: Deploy to Azure VM

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, multistream]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install to app directory
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.cursor' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude 'actions-runner' \
            ./ /home/multistream/MultiStreamCustom/
          sudo /usr/bin/bash /home/multistream/MultiStreamCustom/vm/update.sh

      - name: Verify health
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1/healthz | grep -q '"ok"'; then
              curl -fsS http://127.0.0.1/healthz
              echo
              exit 0
            fi
            sleep 2
          done
          echo "health check failed" >&2
          exit 1
